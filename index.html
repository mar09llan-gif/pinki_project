
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little heart for you ❤️</title>

<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        flex-direction: column;
        font-family: Arial, sans-serif;
        color: white;
    }

    canvas {
        width: min(95vw, 600px);
        height: min(95vw, 600px);
    }

    h2 {
        color: pink;
        text-align: center;
        font-weight: normal;
    }
</style>
</head>

<body>

<h2>A little heart for you ❤️</h2>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const size = 600;
canvas.width = size;
canvas.height = size;

const colors = [
    "red", "blue", "lime", "yellow",
    "cyan", "magenta", "orange", "pink"
];

function heartX(angle) {
    return 16 * Math.pow(Math.sin(angle), 3);
}

function heartY(angle) {
    return 13 * Math.cos(angle)
        - 5 * Math.cos(2 * angle)
        - 2 * Math.cos(3 * angle)
        - Math.cos(4 * angle);
}

function drawHeart() {
    ctx.clearRect(0, 0, size, size);

    const scale = 15;
    const centerX = size / 2;
    const centerY = size / 2 + 20;

    for (let i = 0; i < 120; i++) {
        const angle = i * (Math.PI * 2) / 120;

        const x = heartX(angle) * scale;
        const y = -heartY(angle) * scale;

        const color = colors[
            Math.floor(Math.random() * colors.length)
        ];

        ctx.beginPath();
        ctx.moveTo(centerX + x, centerY + y);
        ctx.lineTo(centerX, centerY - 40);

        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX + x, centerY + y);
        ctx.strokeStyle = color;

        for (let j = 0; j < 8; j++) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(6, 0);
            ctx.stroke();
            ctx.rotate(Math.PI / 4);
        }

        ctx.restore();
    }
}

drawHeart();
</script>

</body>
</html>
