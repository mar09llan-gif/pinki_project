
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little heart for you ❤️</title>

<style>
    body {
        margin: 0;
        background: black;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    h2 {
        color: pink;
        font-weight: normal;
        text-align: center;
    }

    canvas {
        width: min(95vw, 600px);
        height: min(95vw, 600px);
    }

    .pulse {
        animation: heartbeat 1s infinite;
        transform-origin: center;
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.04); }
        45% { transform: scale(1); }
        65% { transform: scale(1.06); }
    }
</style>
</head>

<body>

<h2>Creating something for you... ❤️</h2>
<canvas id="heart" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const colors = [
    "red", "blue", "lime", "yellow",
    "cyan", "magenta", "orange", "pink"
];

const centerX = 300;
const centerY = 320;
const scale = 15;

let points = [];

for (let i = 0; i < 120; i++) {
    const angle = i * Math.PI * 2 / 120;

    const x = 16 * Math.pow(Math.sin(angle), 3);
    const y = 13 * Math.cos(angle)
        - 5 * Math.cos(2 * angle)
        - 2 * Math.cos(3 * angle)
        - Math.cos(4 * angle);

    points.push({
        x: centerX + x * scale,
        y: centerY - y * scale,
        color: colors[Math.floor(Math.random() * colors.length)]
    });
}

let current = 0;

function drawNext() {
    if (current >= points.length) {
        canvas.classList.add("pulse");
        return;
    }

    const p = points[current];

    ctx.beginPath();
    ctx.moveTo(centerX, centerY - 40);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    for (let j = 0; j < 8; j++) {
        const angle = j * Math.PI / 4;

        ctx.beginPath();
        ctx.moveTo(
            p.x + Math.cos(angle) * 0,
            p.y + Math.sin(angle) * 0
        );
        ctx.lineTo(
            p.x + Math.cos(angle) * 6,
            p.y + Math.sin(angle) * 6
        );
        ctx.strokeStyle = p.color;
        ctx.stroke();
    }

    current++;
    setTimeout(drawNext, 45);
}

drawNext();
</script>

</body>
</html>
